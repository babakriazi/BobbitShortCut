name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore shortcut.p12 \
            -storetype PKCS12 \
            -storepass bobbit \
            -keypass bobbit \
            -alias bobbit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bobbit ShortCut, O=Bobbit, C=IR"
          mkdir -p app/src/main/assets
          cp shortcut.p12 app/src/main/assets/shortcut.p12

      - name: Build all slot template APKs
        run: |
          if [ -f gradlew ]; then GW=./gradlew; else GW=gradle; fi
          $GW :template:assembleDebug
          mkdir -p app/src/main/assets/templates
          for i in $(seq -w 0 19); do
            # Gradle flavor output: template-s00-debug.apk etc.
            SRC="template/build/outputs/apk/s${i}/debug/template-s${i}-debug.apk"
            if [ ! -f "$SRC" ]; then
              SRC=$(find template/build/outputs/apk -name "*s${i}*debug*.apk" | head -1)
            fi
            echo "Slot $i <- $SRC"
            cp "$SRC" "app/src/main/assets/templates/t${i}.apk"
          done
          ls -la app/src/main/assets/templates/

      - name: Build manager APK
        run: |
          if [ -f gradlew ]; then ./gradlew :app:assembleDebug; else gradle :app:assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BobbitShortCut-APK
          path: app/build/outputs/apk/debug/app-debug.apk
