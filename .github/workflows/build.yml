name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Generate signing keystore for shortcut APKs
        run: |
          keytool -genkeypair -v \
            -keystore shortcut.p12 \
            -storetype PKCS12 \
            -storepass bobbit \
            -keypass bobbit \
            -alias bobbit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bobbit ShortCut, O=Bobbit, C=IR"
          mkdir -p app/src/main/assets
          cp shortcut.p12 app/src/main/assets/shortcut.p12

      - name: Build template APK
        run: |
          if [ -f gradlew ]; then ./gradlew :template:assembleDebug; else gradle :template:assembleDebug; fi
          mkdir -p app/src/main/assets
          cp template/build/outputs/apk/debug/template-debug.apk app/src/main/assets/template.apk
          ls -la app/src/main/assets/

      - name: Build manager APK
        run: |
          if [ -f gradlew ]; then ./gradlew :app:assembleDebug; else gradle :app:assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BobbitShortCut-APK
          path: app/build/outputs/apk/debug/app-debug.apk
