name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      - name: Generate PNG launcher icons for template (no adaptive XML)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          # Remove adaptive icons so PNG mipmaps are used
          rm -rf template/src/main/res/mipmap-anydpi-v26
          rm -f template/src/main/res/drawable/ic_globe.xml
          for dens in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${dens%%:*}
            size=${dens##*:}
            mkdir -p "template/src/main/res/mipmap-$name"
            convert -size ${size}x${size} xc:'#1565C0' \
              -fill white -gravity center -pointsize $((size/3)) -annotate 0 'W' \
              "template/src/main/res/mipmap-$name/ic_launcher.png"
            cp "template/src/main/res/mipmap-$name/ic_launcher.png" \
              "template/src/main/res/mipmap-$name/ic_launcher_round.png"
          done
          ls -la template/src/main/res/mipmap-*/

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore shortcut.p12 \
            -storetype PKCS12 \
            -storepass bobbit \
            -keypass bobbit \
            -alias bobbit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Bobbit ShortCut, O=Bobbit, C=IR"
          mkdir -p app/src/main/assets
          cp shortcut.p12 app/src/main/assets/shortcut.p12

      - name: Build all slot template APKs
        run: |
          if [ -f gradlew ]; then GW=./gradlew; else GW=gradle; fi
          $GW :template:assembleDebug
          mkdir -p app/src/main/assets/templates
          for i in $(seq -w 0 19); do
            SRC="template/build/outputs/apk/s${i}/debug/template-s${i}-debug.apk"
            if [ ! -f "$SRC" ]; then
              SRC=$(find template/build/outputs/apk -name "*s${i}*debug*.apk" | head -1)
            fi
            echo "Slot $i <- $SRC"
            cp "$SRC" "app/src/main/assets/templates/t${i}.apk"
          done
          ls -la app/src/main/assets/templates/

      - name: Build manager APK
        run: |
          if [ -f gradlew ]; then ./gradlew :app:assembleDebug; else gradle :app:assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BobbitShortCut-APK
          path: app/build/outputs/apk/debug/app-debug.apk
